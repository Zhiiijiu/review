'三个阶段可以用研究问题的递进来记忆。先问一部作品怎样传到另一国，再问不同文学为什么会产生相近的艺术形式，继而问外来形式进入另一种文化后为何产生不同意义。这样既能交代阶段名称，也能解释新理论怎样从前一阶段未能解决的问题中发展出来。',
'使用三种方法时，结论的限度各不相同。翻译出版证明作品有传播渠道，读者的书信可补充实际接触证据。平行比较可以揭示相似的表达功能，影响判断仍须另查史料。变异研究则需要指出变化发生在哪个环节，以及怎样影响作品的意义。',
'例如一个译本发行量很大，可以说明它的流传范围较广。要解释它对文学创作的具体作用，还需要读者反应、评论、后继作品等材料，并交代这些材料各自能证明什么。将影响的范围、程度与实际变化区分开来，能更准确地评价传统研究的局限。',
'根源性和历史性也各有侧重。查清一部作品的译者、出版社和传播路线，有助于确定从哪里出发、传到了哪里。若同一作品在多个时期被重新译介，还要比较每一轮传播为何发生、接受者有何不同。这能说明同一源头为何产生不同的影响轨迹。',
'分析具体相似点时，可以在形式和功能两个层次分别作答。短小凝练属于形式线索，诗人怎样借这类形式记录瞬间感受、引出哲理或表现亲情，则涉及表达功能。把二者写清楚，才能说明借鉴之处和受影响作家的独特性。',
'电子媒介也会改变作品的传播单位。长篇作品可能先以片段、朗读或讨论进入受众视野，再引发对整部作品的阅读。研究者可以据此追踪截取与重组产生的意义变化，以及这种接受路径怎样影响受众最初对作品的理解。',
'翻译研究还可把译作传播前后的环节连起来。作品选择体现译入文化的需要，译本处理体现译者对语言与读者的判断，批评与阅读反应则显示这些处理取得了怎样的效果。从选择、转化到接受考察一部译作，可以具体说明译介学为何能深化跨文化研究。',
'论证时还应交代变化的程度及其可说明性。调整语序以保留原文的叙述重点，与压缩数个情节形成节译，涉及不同层面的选择。读者根据接受对象的标示和译者说明，才能了解作品采用了什么处理方式，并判断其保留和改变的内容。',
'例如一种 外来的叙事方式通过译本被本土作家借鉴，可以用译本出版和流通材料说明接触条件，通过作家自述和作品对读确认具体影响。把这些环节写出来，就能说明翻译文学如何参与形成译入语文学中的新形式，而不仅是增加可供阅读的篇目。',
'研究新课题也可强调文学史叙述单位的变化。原作在不同年代形成多个译本时，翻译活动的编年能够提供基本线索。进一步比较不同译本所承担的文化功能，才能解释为什么有些译本进入课堂与批评史，有些主要影响某个时期的读者。',
'还可区分反复出现的文化想象与单部作品的创造。作家可能继承社会中广泛流通的一种异国印象，也可能借叙述视角或情节结果对这一印象作调整。比较不同作品中的同类形象，可以据此辨认一个时代普遍的想象，以及作家的具体改写。',
'接受学可以把反应各异本身作为需要解释的事实。例如不同群体面对同一译本，有人注意它的伦理观念，有人更关注叙事形式。此时还可进一步追查评论者期待何种文学、为何提出这样的评价，以及该评价是否影响了后来的译介或创作。',
'两类变异可以用证据路径区分。研究传播变异，要比较原作、译本和读者材料，找到意义变化的环节。研究理论阐发的变异，要重建概念原有的适用条件，再检验它用于新材料时解释了什么和遭遇了什么困难。这样的判断也能为理论创新提供依据。',
'作答还可把“相似现象”和“相似原因”分开。共同题材可以从生活经验入手解释，共同文体则要关注写作技法、传承方式和读者需要。一个解释如何成立，取决于材料能否说明从共同处境到具体形式之间的联系。',
'用洪水作例时，可以从主题反过来检查题材安排。若作品重写灾后的协作与重建，这些情节可以支持互助的主题判断。若作品突出灾变前的道德选择与事后的惩罚，洪水便承担另一种作用。只认出母题，尚未回答作品对它赋予了怎样的评价。',
'具体研究还可比较体裁承担的功能。假如一种传统把社会讽刺写入舞台剧，另一传统更多用寓言或小说表达，二者在文类上未必一一对应，仍能比较其批判功能及其表达条件。这个角度有助于解释差异，并增加认识本土文类的方式。',
'答题应把“何时出现”和“为何兴盛”接起来。王国维的尝试说明中国学者较早主动使用跨文化思想资源，理论体系的后续建设还要回应传统范畴怎样解释现代作品、怎样与世界文论相互理解的问题。历史例证和学科建设的需要共同支撑论点。',
'例如两种诗学都讨论由景及情，可以先读各自作品与评论所依据的文学经验，再分析现代读者能否沿用这些说法。一个概念有时能帮助另一传统辨认某一表现层次，两边的术语仍需按各自的历史用法来理解。这正体现两种对话可以在同一问题中互为条件。',
'以“感发”为例，可以从古代文论及作品考察它怎样理解诗歌的感染力，再用现代语言说明感染在阅读过程中可能怎样发生。若与另一诗学的阅读观比较，还能辨认哪些问题彼此相通，哪些现象需要本土范畴来解释。这个过程也体现了阐释学的理论创造。',
'引用作品时，可分别写清表现手段和审美效果。语言可以用先后次序让读者依次感到光影、流水和人声，画面则可在同一观看空间安排远近和虚实。由不同形式引出相通的意趣，才能具体说明诗与画之间的联系。',
'讨论文学的价值还可从读者对时间的把握展开。细读时可以返回词句，比较先前与后来获得的信息，重新理解人物关系和结局。影视也能用重复镜头等方式引导回看。分析各自怎样安排观者或读者接触信息，可以具体说明文学表达及其跨媒介作用。',
'例如写婚姻与阶层时，社会史材料能说明制度和生活条件，作品中的叙述口吻、冲突和结局则显示作家怎样把这些条件组织成情节。再追查出版与评价，才能评估作品是否引发对同一社会问题的新讨论，这也体现了文学相对独立与能动作用。',
'若将这一方法用于同类作品，还可检验意象在不同作品中是否发挥相近功能。写同一个梦的两个文本，可能分别用来表现欲望和制造悬念。结合人物关系、叙事位置与体裁特点，能判断心理解释适用于哪部分材料。',
'科技题材可以进一步联系作品的价值判断。《弗兰肯斯坦》里的冲突不仅来自创造生命的设想，也来自创造者怎样对待被创造者。这样的情节把知识能做什么、研究者承担何种责任和社会如何接纳新事物等问题交织在一起。',
'区域文学还应说明内部差异。区域内使用不同语言的文学，可以通过翻译、教育或共同宗教传统发生联系，同时回应各自的政治文化环境。说明区域概念如何形成时，应举出造成文学联系的实践，并交代这种划分所适用的范围。',
'以同一思潮为例，先梳理作品在两个国家之间的译介和接受，可以辨认具体联系。再以更多地区的文本检验思潮的共同特征，就可以从各地的实践中归纳规律，同时发现一些难以归入共同模式的差异。这能说明总体研究如何由具体比较展开。',
'从外延看，一部广为流传的作品可以是世界文学研究的重要对象，一批尚无世界声誉的作品仍可以提供总体文学研究的材料。说明二者关系时，可以结合某个具体问题，分别回答它要解释世界性流通、总体的共通规律，还是同时涉及两方面。',
'文学也可以改变人们讲述文明历史的方式。诗歌、小说和戏剧保存多种人物的经验，读者通过理解这些表达认识自身传统中的冲突和变化。社会经验以具体形式进入作品，作品则借叙述视角与形象安排参与对这些经验的重新理解。',
'比较时还可说明证据分别来自哪里。神祇冲突和创世顺序来自史诗的叙事内容，宗庙场景及对先祖的礼敬来自《清庙》的语言与礼仪背景。分别由材料支持比较结论，可避免把对两部作品的判断直接推广为整个文明的单一特征。',
'在具体研究中，可以先从双方都可理解的问题建立联系，再让每一传统提出本身的判断依据。若比较中的某个概念无法互译，便说明各自的适用条件，以及为何在共同问题下仍产生不同解释。这些地方往往能够推动对现有理论的修正。',
'例如同一小说可能因某种社会议题受到重视，研究可先查这一议题怎样影响选译、宣传或评论，再细读人物与叙述结构怎样表现议题。通过材料把语境和表达联系起来，可以解释读者为什么产生特定反应，也能保留作品中含义丰富的地方。',
'把机会和条件放在一起论证时，可分析一部作品从翻译、出版到外国读者评论的过程。译者怎样传达作品的艺术特点，出版怎样找到适合的读者，评论怎样进入当地文化讨论，都影响传播效果。主动参与这些环节可以说明教材为何重视全球化带来的机会。',
'再度兴盛还表现为世界文学的研究视野扩大。更多语言和社会经验进入跨国阅读，研究者可以追查一部作品经由不同语言、媒介和接受群体形成的多重轨迹。由此能说明世界文学如何随着实际交往更新，也能解释译介为何会影响作品的世界性位置。'
];
const root = document.getElementById('lit-long-review');
const get = key => root.querySelector('[data-' + key + ']');
const labels = [4,4,4,3,3,3,5,3,3,3].flatMap((size, chapter) =>
  Array.from({length:size}, (_, number) => '第' + (chapter + 1) + '章 · 第' + (number + 1) + '题')
);
let index = 0;
let expanded = true;
cards.forEach(([question], position) => {
  const option = document.createElement('option');
  option.value = position;
  option.textContent = labels[position] + ' · ' + question;
  get('pick').append(option);
});
function render() {
  const [question, outline, ...paragraphs] = cards[index];
  get('count').textContent = labels[index] + '　' + (index + 1) + ' / ' + cards.length;
  get('question').textContent = question;
  get('pick').value = index;
  get('prev').disabled = index === 0;
  get('next').disabled = index === cards.length - 1;
  const toggle = get('toggle');
  toggle.textContent = expanded ? '收起答案' : '展开答案';
  toggle.setAttribute('aria-expanded', String(expanded));
  const answer = get('answer');
  answer.hidden = !expanded;
  answer.replaceChildren();
  if (!expanded) return;
  const guide = document.createElement('p');
  const heading = document.createElement('strong');
  heading.textContent = '答题骨架';
  guide.append(heading, document.createElement('br'), outline);
  answer.append(guide);
  for (const text of [...paragraphs, details[index]]) {
    const paragraph = document.createElement('p');
    paragraph.textContent = text;
    answer.append(paragraph);
  }
}
function go(position) {
  if (!Number.isInteger(position) || position < 0 || position >= cards.length) return;
  index = position;
  expanded = true;
  render();
}
get('toggle').onclick = () => { expanded = !expanded; render(); };
get('pick').onchange = () => go(Number(get('pick').value));
get('prev').onclick = () => go(index - 1);
get('next').onclick = () => go(index + 1);
render();
})();
</script>
</body></html>
